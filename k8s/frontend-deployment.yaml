apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qr-frontend
  template:
    metadata:
      labels:
        app: qr-frontend
    spec:
      containers:
        - name: qr-frontend
          image: elvisprime/qr-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://qr-api:8000"

---

apiVersion: v1
kind: Service
metadata:
  name: qr-frontend
spec:
  selector:
    app: qr-frontend
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer